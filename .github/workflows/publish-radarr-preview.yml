name: Publish MCP-ARR 1.7.3-custom.8
on:
  push:
    branches:
      - feature/manual-import
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'package*.json'
      - '.github/workflows/publish-radarr-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/stephenmahood/mcp-arr:1.7.3-custom.8
