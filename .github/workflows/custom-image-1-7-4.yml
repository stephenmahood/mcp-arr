name: Build MCP-ARR 1.7.4-custom.2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/custom-image-1-7-4.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-publish:
    if: github.repository == 'stephenmahood/mcp-arr'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - run: node --test
      - name: Check package version
        run: test "$(node -p "require('./package.json').version")" = "1.7.4-custom.2"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/stephenmahood/mcp-arr:1.7.4-custom.2
          labels: |
            org.opencontainers.image.version=1.7.4-custom.2
            org.opencontainers.image.source=https://github.com/stephenmahood/mcp-arr
