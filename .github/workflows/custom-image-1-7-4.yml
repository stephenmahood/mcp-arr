name: Build MCP-ARR 1.7.4-custom.3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/custom-image-1-7-4.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-publish:
    if: github.repository == 'stephenmahood/mcp-arr'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - run: node --test
      - name: Verify package and lockfile versions
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version !== l.version || p.version !== l.packages[''].version) process.exit(1)"
      - name: Read image version
        id: version
        run: echo "value=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/stephenmahood/mcp-arr:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.source=https://github.com/stephenmahood/mcp-arr
